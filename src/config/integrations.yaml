# Source template copied to .agent-workflow/integrations.yaml when absent.
integrations:
  enabled: true
  jira:
    enabled: false
    project_key: ""
    issue_type: "Story"
    status_names:
      todo: "To Do"
      in_progress: "In Progress"
      in_review: "In Review"
      done: "Done"
  github:
    enabled: false
    api_url: "https://api.github.com"
    repo: "owner/repository"
  telegram:
    enabled: false
  logging:
    enabled: false
