# Source template copied to .agent-workflow/integrations.yaml when absent.
integrations:
  enabled: true
  jira:
    enabled: false
    project_key: ""
    issue_type: "Story"
    # Optional human-facing Jira site URL when JIRA_API_URL is a scoped API base.
    browse_base_url: ""
    # Optional existing default Epic; a story's ### Epic value overrides it.
    epic_key: ""
    status_names:
      # Reopen a completed parent Epic to this destination after story creation.
      todo: "To Do"
      in_progress: "In Progress"
      in_review: "In Review"
      done: "Done"
      # Optional; omit unless this workflow has a matching transition.
      # blocked: "Blocked"
  github:
    enabled: false
    api_url: "https://api.github.com"
    repo: "owner/repository"
  telegram:
    enabled: false
  logging:
    enabled: false
